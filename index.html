<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CBE Mobile Banking</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#7a1fa2" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mobile Banking App" />
<meta name="application-name" content="Mobile Banking App" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Mobile Banking App — Commercial Bank of Ethiopia mobile banking" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/screens.css" />
</head>
<body>
  <!-- Phone shell: fills the viewport on handsets, centred card on desktop -->
  <div class="phone" id="phone">
    <div class="stack" id="stack" aria-live="polite"></div>
    <div class="overlays" id="overlays"></div>
    <div class="secure-veil" id="secure-veil" aria-hidden="true">
      <div class="secure-veil__inner">
        <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
          <path fill="currentColor" d="M12 2 4 5.5v6c0 5 3.4 9.6 8 10.5 4.6-.9 8-5.5 8-10.5v-6L12 2Zm-1 13.5-3.2-3.2 1.4-1.4L11 12.7l4.8-4.8 1.4 1.4L11 15.5Z"/>
        </svg>
        <p>Screen capture is disabled on this screen</p>
      </div>
    </div>
  </div>

  <script src="js/core/util.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/qr.js"></script>
  <script src="js/core/fees.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/brands.js"></script>
  <script src="js/core/guard.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/install.js"></script>
  <script src="js/core/capture.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/transactions.js"></script>
  <script src="js/screens/transfer.js"></script>
  <script src="js/screens/receipt.js"></script>
  <script src="js/screens/receive.js"></script>
  <script src="js/screens/services.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/screens/misc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
